name: PC Windows 32GB RAM + SSD NVMe

on:
  workflow_dispatch:
    inputs:
      horas_ligado:
        description: 'Quantas horas manter o PC ligado? (Max: 5)'
        required: true
        default: '5'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'

permissions:
  contents: write

jobs:
  build:
    name: PC Windows 32GB RAM + 150GB NVMe
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Carregar Arquivos Salvos
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. Liberar +150GB no SSD NVMe e Destravar 32GB de Memoria
        shell: powershell
        run: |
          Write-Host "1/2 - Limpando pastas pesadas nos discos C: e D: para liberar o SSD NVMe..."
          $pastas = @(
            "C:\hostedtoolcache",
            "C:\Android",
            "C:\Program Files\dotnet",
            "C:\Program Files\MongoDB",
            "C:\mysql",
            "C:\Program Files\Microsoft SDKs",
            "C:\Program Files\Microsoft SQL Server",
            "C:\Strawberry",
            "C:\ghcup",
            "D:\a\_temp"
          )
          foreach ($pasta in $pastas) {
            if (Test-Path $pasta) {
              Remove-Item -Path $pasta -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

          Write-Host "2/2 - Destravando 32GB de Memoria Total no SSD NVMe..."
          $cs = Get-CimInstance -ClassName Win32_ComputerSystem
          Set-CimInstance -InputObject $cs -Property @{AutomaticManagedPagefile=$false} -ErrorAction SilentlyContinue

          $pfC = Get-CimInstance -ClassName Win32_PageFileSetting | Where-Object { $_.Name -like "C:*" }
          if ($pfC) {
            Set-CimInstance -InputObject $pfC -Property @{InitialSize=16384; MaximumSize=16384} -ErrorAction SilentlyContinue
          } else {
            New-CimInstance -ClassName Win32_PageFileSetting -Property @{Name="C:\pagefile.sys"; InitialSize=16384; MaximumSize=16384} -ErrorAction SilentlyContinue | Out-Null
          }
          Get-PSDrive C, D

      - name: 3. Criar Usuario Vidax, Ativar RDP e Conectar Tailscale
        shell: powershell
        env:
          TS_KEY: ${{ secrets.TAILSCALE_KEY }}
        run: |
          Write-Host "=== Criando Usuario Admin 'vidax' e Destravando RDP ==="
          $SenhaSegura = ConvertTo-SecureString "Vidax@2026!" -AsPlainText -Force

          # Cria o usuario 'vidax' do zero como Administrador
          Remove-LocalUser -Name "vidax" -ErrorAction SilentlyContinue
          New-LocalUser -Name "vidax" -Password $SenhaSegura -FullName "Vidax Admin" -PasswordNeverExpires -UserMayNotChangePassword
          Add-LocalGroupMember -Group "Administrators" -Member "vidax" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "vidax" -ErrorAction SilentlyContinue

          # Tambem atualiza o runneradmin por garantia
          Set-LocalUser -Name "runneradmin" -Password $SenhaSegura -ErrorAction SilentlyContinue
          Enable-LocalUser -Name "runneradmin" -ErrorAction SilentlyContinue

          # Desbloqueia politicas de login RDP no Windows Server 2025
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "Allow-RDP-3389" -Direction Inbound -LocalPort 3389 -Protocol TCP -Action Allow -ErrorAction SilentlyContinue | Out-Null
          Restart-Service -Name "TermService" -Force -ErrorAction SilentlyContinue

          Set-Service -Name "Audiosrv" -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name "Audiosrv" -ErrorAction SilentlyContinue

          # Instala e conecta o Tailscale
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale.exe"
          Start-Process -FilePath ".\tailscale.exe" -ArgumentList "/quiet" -Wait
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$env:TS_KEY" --hostname="pc-virtual-32gb" --unattended --reset
          Start-Sleep -Seconds 5
          Write-Host "=========================================="
          Write-Host "PRONTO PARA CONECTAR!"
          Write-Host "USUARIO: vidax"
          Write-Host "SENHA:   Vidax@2026!"
          Write-Host "=========================================="

      - name: 4. Abrir Programas Automaticamente (Pasta Persistente)
        shell: powershell
        run: |
          if (!(Test-Path ".\meus_arquivos")) { New-Item -ItemType Directory -Path ".\meus_arquivos" }
          if (Test-Path ".\meus_arquivos\iniciar.bat") {
            Start-Process -FilePath ".\meus_arquivos\iniciar.bat" -WorkingDirectory ".\meus_arquivos"
          }

      - name: 5. Manter PC Ligado pelo Tempo Escolhido
        shell: powershell
        run: |
          $horas = [int]"${{ github.event.inputs.horas_ligado }}"
          $segundos = $horas * 3600
          Write-Host "O PC ficara ligado por $horas hora(s) ($segundos segundos)."
          Start-Sleep -Seconds $segundos

      - name: 6. Salvar Arquivos e Desligar PC com Seguranca
        if: always()
        shell: powershell
        run: |
          git config --global user.name "AutoSave Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add ./meus_arquivos/*
          git commit -m "Backup automatico ao desligar" ; if ($LASTEXITCODE -ne 0) { Write-Host "Sem arquivos novos para salvar" }
          git push
          & "C:\Program Files\Tailscale\tailscale.exe" logout
          
