name: PC Windows 32GB RAM + SSD NVMe

on:
  workflow_dispatch:
    inputs:
      horas_ligado:
        description: 'Quantas horas manter o PC ligado? (Max: 5)'
        required: true
        default: '5'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'

permissions:
  contents: write

jobs:
  build:
    name: PC Windows 32GB RAM + 150GB NVMe
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Carregar Arquivos Salvos
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. Liberar +150GB no SSD NVMe e Destravar 32GB de Memoria
        shell: powershell
        run: |
          Write-Host "1/2 - Limpando pastas pesadas nos discos C: e D: para liberar o SSD NVMe..."
          $pastas = @(
            "C:\hostedtoolcache",
            "C:\Android",
            "C:\Program Files\dotnet",
            "C:\Program Files\MongoDB",
            "C:\mysql",
            "C:\Program Files\Microsoft SDKs",
            "C:\Program Files\Microsoft SQL Server",
            "C:\Strawberry",
            "C:\ghcup",
            "D:\a\_temp"
          )
          foreach ($pasta in $pastas) {
            if (Test-Path $pasta) {
              Remove-Item -Path $pasta -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

          Write-Host "2/2 - Destravando 32GB de Memoria Total no SSD NVMe..."
          # Desativa gerenciamento automatico para permitir forcar 16GB extras de Pagefile
          $cs = Get-CimInstance -ClassName Win32_ComputerSystem
          Set-CimInstance -InputObject $cs -Property @{AutomaticManagedPagefile=$false} -ErrorAction SilentlyContinue

          # Atualiza o pagefile existente no disco D: (ou C:) para 16384 MB (16 GB)
          $pfD = Get-CimInstance -ClassName Win32_PageFileSetting | Where-Object { $_.Name -like "D:*" }
          if ($pfD) {
            Set-CimInstance -InputObject $pfD -Property @{InitialSize=16384; MaximumSize=16384} -ErrorAction SilentlyContinue
          } else {
            New-CimInstance -ClassName Win32_PageFileSetting -Property @{Name="D:\pagefile.sys"; InitialSize=16384; MaximumSize=16384} -ErrorAction SilentlyContinue | Out-Null
          }

          # Tambem garante pagefile no NVMe C: para aplicacao imediata de commit limit (32GB+)
          $pfC = Get-CimInstance -ClassName Win32_PageFileSetting | Where-Object { $_.Name -like "C:*" }
          if ($pfC) {
            Set-CimInstance -InputObject $pfC -Property @{InitialSize=16384; MaximumSize=16384} -ErrorAction SilentlyContinue
          } else {
            New-CimInstance -ClassName Win32_PageFileSetting -Property @{Name="C:\pagefile.sys"; InitialSize=16384; MaximumSize=16384} -ErrorAction SilentlyContinue | Out-Null
          }

          Write-Host "=== Status do SSD NVMe e Memoria Configurada ==="
          Get-CimInstance Win32_PageFileSetting | Select-Object Name, InitialSize, MaximumSize
          Get-PSDrive C, D

      - name: 3. Ativar Tela Remota (Windows Server 2025 Fix) e Conectar Tailscale
        shell: powershell
        env:
          TS_KEY: ${{ secrets.TAILSCALE_KEY }}
          SENHA_RDP: ${{ secrets.RDP_PASS }}
        run: |
          Write-Host "=== Habilitando e Iniciando o Servico RDP no Windows Server 2025 ==="
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0

          # Libera Firewall e forca o servico TermService (RDP) a rodar
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "Allow-RDP-3389" -Direction Inbound -LocalPort 3389 -Protocol TCP -Action Allow -ErrorAction SilentlyContinue | Out-Null
          Set-Service -Name "UmRdpService" -StartupType Automatic -ErrorAction SilentlyContinue
          Set-Service -Name "TermService" -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name "UmRdpService" -ErrorAction SilentlyContinue
          Start-Service -Name "TermService" -ErrorAction SilentlyContinue

          # Ativa o Audio
          Set-Service -Name "Audiosrv" -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name "Audiosrv" -ErrorAction SilentlyContinue

          # Configura Usuario e Senha
          $senhaFinal = if ([string]::IsNullOrEmpty($env:SENHA_RDP)) { "SenhaForte123!" } else { $env:SENHA_RDP }
          net user runneradmin "$senhaFinal" /active:yes
          net localgroup "Remote Desktop Users" runneradmin /add 2>$null

          # Instala e Conecta o Tailscale (com --accept-routes e firewall liberado)
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale.exe"
          Start-Process -FilePath ".\tailscale.exe" -ArgumentList "/quiet" -Wait
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$env:TS_KEY" --hostname="pc-virtual-32gb" --unattended --reset
          Start-Sleep -Seconds 5
          Write-Host "VM Conectada ao Tailscale com Sucesso! Veja o novo IP no seu app do Tailscale."

      - name: 4. Abrir Programas Automaticamente (Pasta Persistente)
        shell: powershell
        run: |
          if (!(Test-Path ".\meus_arquivos")) { New-Item -ItemType Directory -Path ".\meus_arquivos" }
          if (Test-Path ".\meus_arquivos\iniciar.bat") {
            Start-Process -FilePath ".\meus_arquivos\iniciar.bat" -WorkingDirectory ".\meus_arquivos"
          }

      - name: 5. Manter PC Ligado pelo Tempo Escolhido
        shell: powershell
        run: |
          $horas = [int]"${{ github.event.inputs.horas_ligado }}"
          $segundos = $horas * 3600
          Write-Host "O PC ficara ligado por $horas hora(s) ($segundos segundos)."
          Start-Sleep -Seconds $segundos

      - name: 6. Salvar Arquivos e Desligar PC com Seguranca
        if: always()
        shell: powershell
        run: |
          Write-Host "Salvando arquivos da pasta 'meus_arquivos' antes de desligar..."
          git config --global user.name "AutoSave Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add ./meus_arquivos/*
          git commit -m "Backup automatico ao desligar" ; if ($LASTEXITCODE -ne 0) { Write-Host "Sem arquivos novos para salvar" }
          git push

          Write-Host "Desconectando do Tailscale e desligando..."
          & "C:\Program Files\Tailscale\tailscale.exe" logout
          
