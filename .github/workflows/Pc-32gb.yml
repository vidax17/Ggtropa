name: PC Windows 32GB RAM + SSD NVMe

on:
  workflow_dispatch:
    inputs:
      horas_ligado:
        description: 'Quantas horas manter o PC ligado? (Max: 5)'
        required: true
        default: '5'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'

permissions:
  contents: write

jobs:
  build:
    name: PC Windows 32GB RAM + 150GB NVMe
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Carregar Arquivos Salvos
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. Liberar +150GB no SSD NVMe e Ativar 32GB de Memoria na Hora
        shell: powershell
        run: |
          Write-Host "1/2 - Limpando pastas pesadas nos discos C: e D: para liberar o SSD NVMe..."
          $pastas = @(
            "C:\hostedtoolcache",
            "C:\Android",
            "C:\Program Files\dotnet",
            "C:\Program Files\MongoDB",
            "C:\mysql",
            "C:\Program Files\Microsoft SDKs",
            "C:\Program Files\Microsoft SQL Server",
            "C:\Strawberry",
            "C:\ghcup",
            "D:\a\_temp"
          )
          foreach ($pasta in $pastas) {
            if (Test-Path $pasta) {
              Remove-Item -Path $pasta -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

          Write-Host "2/2 - Ativando +16GB no SSD NVMe D: (32GB Totais Imediatos sem reiniciar!)..."
          $cs = Get-WmiObject Win32_ComputerSystem -EnableAllPrivileges
          $cs.AutomaticManagedPagefile = $false
          $cs.Put() | Out-Null

          Set-WmiInstance -Class Win32_PageFileSetting -Arguments @{Name="D:\pagefile.sys"; InitialSize = 16384; MaximumSize = 16384} -ErrorAction SilentlyContinue | Out-Null

          Write-Host "=== Status da Memoria e SSD NVMe ==="
          Get-CimInstance Win32_OperatingSystem | Select-Object `
            @{Name="RAM_Fisica_GB";Expression={[math]::Round($_.TotalVisibleMemorySize / 1MB, 1)}}, `
            @{Name="Memoria_Total_32GB";Expression={[math]::Round($_.TotalVirtualMemorySize / 1MB, 1)}}
          Get-PSDrive C, D

      - name: 3. Ativar Tela Remota (RDP) e Conectar Tailscale
        shell: powershell
        env:
          TS_KEY: ${{ secrets.TAILSCALE_KEY }}
          SENHA_RDP: ${{ secrets.RDP_PASS }}
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-Service -Name "Audiosrv" -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name "Audiosrv" -ErrorAction SilentlyContinue

          $senhaFinal = if ([string]::IsNullOrEmpty($env:SENHA_RDP)) { "SenhaForte123!" } else { $env:SENHA_RDP }
          net user runneradmin "$senhaFinal"

          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale.exe"
          Start-Process -FilePath ".\tailscale.exe" -ArgumentList "/quiet" -Wait
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$env:TS_KEY" --hostname="pc-virtual-32gb" --unattended
          Start-Sleep -Seconds 5
          Write-Host "VM Conectada ao Tailscale com Sucesso! Veja o IP no seu app do Tailscale."

      - name: 4. Abrir Programas Automaticamente (Pasta Persistente)
        shell: powershell
        run: |
          if (!(Test-Path ".\meus_arquivos")) { New-Item -ItemType Directory -Path ".\meus_arquivos" }
          if (Test-Path ".\meus_arquivos\iniciar.bat") {
            Start-Process -FilePath ".\meus_arquivos\iniciar.bat" -WorkingDirectory ".\meus_arquivos"
          }

      - name: 5. Manter PC Ligado pelo Tempo Escolhido
        shell: powershell
        run: |
          $horas = [int]"${{ github.event.inputs.horas_ligado }}"
          $segundos = $horas * 3600
          Write-Host "O PC ficara ligado por $horas hora(s) ($segundos segundos)."
          Write-Host "Para desligar antes e salvar seus arquivos, basta clicar em 'Cancel workflow' no GitHub!"
          Start-Sleep -Seconds $segundos

      - name: 6. Salvar Arquivos e Desligar PC com Seguranca
        if: always()
        shell: powershell
        run: |
          Write-Host "Salvando arquivos da pasta 'meus_arquivos' antes de desligar..."
          git config --global user.name "AutoSave Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add ./meus_arquivos/*
          git commit -m "Backup automatico ao desligar" ; if ($LASTEXITCODE -ne 0) { Write-Host "Sem arquivos novos para salvar" }
          git push

          Write-Host "Desconectando do Tailscale e desligando..."
          & "C:\Program Files\Tailscale\tailscale.exe" logout
          
